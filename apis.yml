aid: gradiant
name: Gradiant
description: 'Gradiant is a global water and wastewater infrastructure company founded
  in 2013 out of MIT and headquartered in Boston, Massachusetts, that designs, builds
  and operates end-to-end industrial water systems from intake to discharge. It positions
  itself as "the Water Layer of the AI Economy", supplying ultrapure water, process
  water, wastewater recycling, minimal- and zero-liquid-discharge and resource-recovery
  systems to semiconductor fabs, AI data centers, energy producers and applied industries
  including pharmaceuticals, mining, food and beverage, refining and chemicals, textiles
  and renewables. Its proprietary technology portfolio includes Counterflow Reverse
  Osmosis (CFRO), Semi-Batch Reverse Osmosis (SBRO), Carrier Gas Extraction (CGE),
  Selective Contaminant Extraction (SCE), Free Radical Oxidation (FRO), Bio Infinity,
  the ForeverGone PFAS destruction process, the HyperSolved data-center cooling-water
  platform, the CURE Chemicals specialty-chemicals line and SmartOps AI, a machine-learning
  platform for optimizing and predicting plant operations. Gradiant raised a Series
  E at a $2 billion valuation in May 2026. It is an industrial equipment, chemicals
  and build-own-operate services company: it publishes no public developer portal,
  no developer API, no SDK and no machine-readable API contract, and SmartOps AI is
  delivered as a customer-facing operations platform rather than as a public API.'
